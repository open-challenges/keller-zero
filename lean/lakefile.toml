name = "kellerzero"
defaultTargets = ["KellerZero"]

# Mathlib is pinned to one commit (the v4.36.0 release); lean-toolchain names the Lean it needs.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "fc4f59e577feb1a4956671bc04ac18aaaf8cd842"

[[lean_lib]]
name = "KellerZero"
